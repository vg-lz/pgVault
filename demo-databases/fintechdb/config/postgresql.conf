# =====================================================================
# FintechDB v1.0 — postgresql.conf
# Intentionally misconfigured for the PgVault project.
# H08, H10 are set here.
# =====================================================================

# Connection settings
listen_addresses = '*'
max_connections = 100
port = 5432

# Memory (sane defaults for demo)
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB

# WAL and archiving
# ---------------------------------------------------------------------
# H10: archive_mode = off — there's no point-in-time recovery / backup
# A compliant fintech should have archive_mode = on with archive_command
# ---------------------------------------------------------------------
archive_mode = off
wal_level = replica

# ---------------------------------------------------------------------
# H08: Logging completely disabled — no audit trail of DB access
# A compliant system should log connections, statements, and durations
# ---------------------------------------------------------------------
log_connections = off
log_disconnections = off
log_statement = 'none'
log_min_duration_statement = -1
log_destination = 'stderr'

# Other sane defaults
random_page_cost = 4.0
effective_cache_size = 512MB
checkpoint_completion_target = 0.9
wal_buffers = 4MB

# Timezone
log_timezone = 'America/Mexico_City'
timezone = 'America/Mexico_City'

# Locale
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
