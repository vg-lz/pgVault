services:
  # Local PostgreSQL instance used by the team during development.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fintechdb
      POSTGRES_USER: pgvault_readonly
      POSTGRES_PASSWORD: pgvault_password
    ports:
      - "5432:5432"
    volumes:
      - pgvault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # PgVault starts only after PostgreSQL is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U pgvault_readonly -d fintechdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PgVault application container. It runs one scan and exits with JSON output.
  pgvault:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fintechdb
      PGUSER: pgvault_readonly
      PGPASSWORD: pgvault_password
      PGSSLMODE: disable
      PGVAULT_SAMPLE_LIMIT: "100"
      PGVAULT_QUERY_TIMEOUT_SECONDS: "10"
    command: ["python", "-m", "pgvault", "scan"]

volumes:
  # Keeps the local database files across Compose restarts.
  pgvault_postgres_data:
